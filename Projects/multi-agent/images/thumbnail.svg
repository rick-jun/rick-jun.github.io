<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Multi-agent metrics dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8913a"/>
      <stop offset="100%" stop-color="#b8722e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b9bd5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ec973"/>
      <stop offset="100%" stop-color="#2f8a4d"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#grid)"/>

  <!-- Top-left mono label -->
  <g font-family="SF Mono, Consolas, monospace" fill="#6b7280">
    <text x="24" y="32" font-size="10" letter-spacing="2">PORTFOLIO_METRICS</text>
    <text x="24" y="48" font-size="9" fill="#e8913a" letter-spacing="1.5">● LIVE · CTO-AGENT</text>
  </g>

  <!-- KPI cards row -->
  <g font-family="SF Mono, Consolas, monospace">
    <!-- Card 1: Cost -->
    <rect x="24" y="64" width="130" height="58" rx="6" fill="#1a1d24" stroke="#2a2e3a"/>
    <text x="34" y="80" font-size="8" fill="#6b7280" letter-spacing="1.2">TOTAL COST</text>
    <text x="34" y="106" font-size="20" fill="#e8913a" font-weight="700">$7.93</text>

    <!-- Card 2: Sessions -->
    <rect x="160" y="64" width="130" height="58" rx="6" fill="#1a1d24" stroke="#2a2e3a"/>
    <text x="170" y="80" font-size="8" fill="#6b7280" letter-spacing="1.2">SESSIONS</text>
    <text x="170" y="106" font-size="20" fill="#ffffff" font-weight="700">142</text>

    <!-- Card 3: Tokens -->
    <rect x="296" y="64" width="130" height="58" rx="6" fill="#1a1d24" stroke="#2a2e3a"/>
    <text x="306" y="80" font-size="8" fill="#6b7280" letter-spacing="1.2">TOKENS</text>
    <text x="306" y="106" font-size="20" fill="#ffffff" font-weight="700">7.4M</text>

    <!-- Card 4: Cache -->
    <rect x="432" y="64" width="144" height="58" rx="6" fill="#1a1d24" stroke="#2a2e3a"/>
    <text x="442" y="80" font-size="8" fill="#6b7280" letter-spacing="1.2">CACHE HIT</text>
    <text x="442" y="106" font-size="20" fill="#4ec973" font-weight="700">96.7%</text>
  </g>

  <!-- Chart area -->
  <g transform="translate(24,144)">
    <rect x="0" y="0" width="552" height="138" rx="6" fill="#1a1d24" stroke="#2a2e3a"/>

    <!-- Y axis grid -->
    <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
      <line x1="44" y1="20" x2="540" y2="20"/>
      <line x1="44" y1="50" x2="540" y2="50"/>
      <line x1="44" y1="80" x2="540" y2="80"/>
      <line x1="44" y1="110" x2="540" y2="110"/>
    </g>

    <!-- Y axis labels -->
    <g font-family="SF Mono, Consolas, monospace" font-size="7" fill="#6b7280" text-anchor="end">
      <text x="40" y="23">$8</text>
      <text x="40" y="53">$6</text>
      <text x="40" y="83">$3</text>
      <text x="40" y="113">$0</text>
    </g>

    <!-- Bars: 7 days, stacked dimensions -->
    <g>
      <!-- Day 1 -->
      <rect x="60"  y="92"  width="14" height="18" fill="url(#orange)"/>
      <rect x="76"  y="100" width="14" height="10" fill="url(#blue)"/>
      <!-- Day 2 -->
      <rect x="130" y="80"  width="14" height="30" fill="url(#orange)"/>
      <rect x="146" y="92"  width="14" height="18" fill="url(#blue)"/>
      <rect x="162" y="102" width="14" height="8"  fill="url(#green)"/>
      <!-- Day 3 -->
      <rect x="200" y="68"  width="14" height="42" fill="url(#orange)"/>
      <rect x="216" y="84"  width="14" height="26" fill="url(#blue)"/>
      <!-- Day 4 -->
      <rect x="270" y="56"  width="14" height="54" fill="url(#orange)"/>
      <rect x="286" y="74"  width="14" height="36" fill="url(#blue)"/>
      <rect x="302" y="96"  width="14" height="14" fill="url(#green)"/>
      <!-- Day 5 -->
      <rect x="340" y="48"  width="14" height="62" fill="url(#orange)"/>
      <rect x="356" y="70"  width="14" height="40" fill="url(#blue)"/>
      <rect x="372" y="90"  width="14" height="20" fill="url(#green)"/>
      <!-- Day 6 -->
      <rect x="410" y="36"  width="14" height="74" fill="url(#orange)"/>
      <rect x="426" y="62"  width="14" height="48" fill="url(#blue)"/>
      <rect x="442" y="86"  width="14" height="24" fill="url(#green)"/>
      <!-- Day 7 (today, highlighted) -->
      <rect x="480" y="28"  width="14" height="82" fill="url(#orange)"/>
      <rect x="496" y="56"  width="14" height="54" fill="url(#blue)"/>
      <rect x="512" y="80"  width="14" height="30" fill="url(#green)"/>
    </g>

    <!-- X axis labels -->
    <g font-family="SF Mono, Consolas, monospace" font-size="7" fill="#6b7280" text-anchor="middle">
      <text x="74"  y="126">04-30</text>
      <text x="146" y="126">05-01</text>
      <text x="216" y="126">05-02</text>
      <text x="286" y="126">05-03</text>
      <text x="356" y="126">05-04</text>
      <text x="426" y="126">05-05</text>
      <text x="496" y="126">05-06</text>
    </g>

    <!-- Legend swatches -->
    <g font-family="SF Mono, Consolas, monospace" font-size="8" fill="#c8ccd4">
      <rect x="44"  y="6" width="8" height="8" fill="url(#orange)"/>
      <text x="56" y="13">cto-agent</text>
      <rect x="124" y="6" width="8" height="8" fill="url(#blue)"/>
      <text x="136" y="13">solo-agent</text>
      <rect x="208" y="6" width="8" height="8" fill="url(#green)"/>
      <text x="220" y="13">pm-agent</text>
    </g>
  </g>
</svg>
