<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#4fc3f7"/></marker>
    <marker id="b" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#aaa"/></marker>
    <marker id="c" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#38ef7d"/></marker>
  </defs>

  <text x="410" y="22" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="13" font-weight="bold">AgentWorkShop — System Architecture</text>

  <!-- Claude (Cowork) -->
  <rect x="20" y="45" width="150" height="70" rx="6" fill="#1a1a3e" stroke="#7c4dff" stroke-width="2"/>
  <text x="95" y="68" text-anchor="middle" fill="#7c4dff" font-family="monospace" font-size="11" font-weight="bold">Claude</text>
  <text x="95" y="84" text-anchor="middle" fill="#7c4dff" font-family="monospace" font-size="10">(Cowork)</text>
  <text x="95" y="103" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">Architecture · Design</text>
  <text x="95" y="114" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">Orchestration</text>

  <!-- DeepSeek -->
  <rect x="20" y="140" width="150" height="60" rx="6" fill="#1a2a1a" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="95" y="163" text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="11" font-weight="bold">DeepSeek</text>
  <text x="95" y="179" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">Code generation</text>
  <text x="95" y="191" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">Content writing · Execution</text>

  <!-- Ollama -->
  <rect x="20" y="220" width="150" height="55" rx="6" fill="#1a2a1a" stroke="#38ef7d" stroke-width="1" stroke-dasharray="4,2"/>
