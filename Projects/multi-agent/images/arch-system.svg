  <text x="95" y="259" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">Local models (optional)</text>
  <text x="95" y="271" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">llama3.2 · etc.</text>

  <!-- LangGraph Workflow -->
  <rect x="240" y="45" width="200" height="230" rx="6" fill="#0d1a2e" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="340" y="68" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11" font-weight="bold">LangGraph Workflow</text>
  <text x="340" y="82" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">MyWebPage / workflow.py</text>
  <line x1="250" y1="90" x2="430" y2="90" stroke="#4fc3f7" stroke-width="0.5" opacity="0.3"/>

  <!-- Nodes in workflow -->
  <rect x="260" y="98" width="160" height="22" rx="3" fill="#1a2236" stroke="#4fc3f7" stroke-width="0.8"/>
  <text x="340" y="113" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9">audit → brief</text>

  <rect x="260" y="128" width="160" height="22" rx="3" fill="#1a1a3e" stroke="#7c4dff" stroke-width="1"/>
  <text x="340" y="143" text-anchor="middle" fill="#7c4dff" font-family="monospace" font-size="9">checkpoint (HiL)</text>

  <rect x="260" y="158" width="160" height="22" rx="3" fill="#1a2236" stroke="#4fc3f7" stroke-width="0.8"/>
  <text x="340" y="173" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9">build → card</text>

  <rect x="260" y="188" width="160" height="22" rx="3" fill="#1a2236" stroke="#4fc3f7" stroke-width="0.8"/>
  <text x="340" y="203" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9">review → repair</text>

  <rect x="260" y="220" width="160" height="40" rx="3" fill="#0a1a0a" stroke="#38ef7d" stroke-width="0.8"/>
  <text x="340" y="236" text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="8">GitHub Pages output</text>
  <text x="340" y="250" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">rick-jun.github.io</text>

  <!-- HiL -->
  <rect x="510" y="115" width="130" height="60" rx="6" fill="#1a1a1a" stroke="#f0a500" stroke-width="1.5"/>
  <text x="575" y="137" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="10" font-weight="bold">Human-in-Loop</text>
  <text x="575" y="153" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">Telegram bot</text>
  <text x="575" y="165" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">Desktop popup (tkinter)</text>

  <!-- SQLite -->
  <rect x="510" y="200" width="130" height="45" rx="6" fill="#1a1a1a" stroke="#888" stroke-width="1"/>
  <text x="575" y="220" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">SQLite</text>
  <text x="575" y="236" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">runs · nodes · tokens</text>

  <!-- OpenSearch -->
  <rect x="510" y="265" width="130" height="45" rx="6" fill="#1a2a1a" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="575" y="285" text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="10">OpenSearch</text>
  <text x="575" y="300" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">analytics · dashboards</text>

  <!-- Arrows -->
  <line x1="170" y1="80" x2="238" y2="110" stroke="#7c4dff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="170" y1="170" x2="238" y2="170" stroke="#38ef7d" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="140" x2="508" y2="145" stroke="#f0a500" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="440" y1="215" x2="508" y2="220" stroke="#aaa" stroke-width="1" marker-end="url(#b)"/>
  <line x1="575" y1="245" x2="575" y2="263" stroke="#38ef7d" stroke-width="1.2" marker-end="url(#c)"/>
